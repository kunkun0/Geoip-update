name: Auto Merge Multi-Source CN GeoIP (Weekly)

on:
  schedule:
    # 每周日 UTC 19:00 (北京时间每周一凌晨 03:00) 自动触发
    - cron: '0 19 * * 0'
  workflow_dispatch: # 支持手动点按触发

permissions:
  contents: write

jobs:
  build-multi-source-geoip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maxminddb mmdb-writer netaddr

      - name: Run Multi-Source Merge Script
        run: python crop_geoip.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 强制暂存生成的 GeoIP-CN.mmdb 文件
          git add GeoIP-CN.mmdb

          if git diff --cached --quiet; then
            echo "GeoIP 数据无变化，跳过提交。"
          else
            git commit -m "auto: 周更纯 IPv4 CN GeoIP 数据库 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

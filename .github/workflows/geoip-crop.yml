name: Auto Merge Multi-Source CN GeoIP

on:
  schedule:
    # 每 2 天凌晨 03:00 (UTC 19:00) 自动抓取多源并重新打包
    - cron: '0 19 */2 * *'
  workflow_dispatch: # 支持手动点击运行

permissions:
  contents: write

jobs:
  build-multi-source-geoip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maxminddb mmdb-writer

      - name: Run Multi-Source Merge Script
        run: python crop_geoip.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 清楚临时文件
          rm -f tmp_*.mmdb

          if git diff --quiet GeoIP-CN.mmdb 2>/dev/null; then
            echo "GeoIP 数据无变化，跳过提交。"
          else
            git add GeoIP-CN.mmdb
            git commit -m "auto: 整合多源最新 CN GeoIP 数据 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
